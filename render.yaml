services:
  - type: web
    name: live-counter
    env: elixir
    plan: free
    buildCommand: ./build.sh
    startCommand: MIX_ENV=prod mix phx.server
    envVars:
      - key: MIX_ENV
        value: prod
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: live-counter-db
          property: connectionString

databases:
  - name: live-counter-db
    plan: free
